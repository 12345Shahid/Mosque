<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Khutbah Display — MosqAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --emerald: #10b981; --gold: #f59e0b; --gold-light: #fde68a; --bg: #050a14; --divider: rgba(255,255,255,0.08); --text-muted: rgba(255,255,255,0.45); }
    html, body { height: 100%; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
    #topbar { position: fixed; top: 0; left: 0; right: 0; height: 64px; background: rgba(5,10,20,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--divider); display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem; z-index: 100; }
    #topbar .left { display: flex; align-items: center; gap: 1rem; }
    #mosque-name { font-size: 1.25rem; font-weight: 700; }
    #clock { font-family: monospace; font-size: 1.05rem; font-weight: 600; color: rgba(255,255,255,0.7); letter-spacing: 0.05em; }
    .live-badge { display: flex; align-items: center; gap: 0.5rem; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.5); color: #34d399; padding: 0.35rem 0.85rem; border-radius: 999px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.05em; }
    .live-badge.idle { background: rgba(148,163,184,0.1); border-color: rgba(148,163,184,0.3); color: #94a3b8; }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; animation: pulse 1.5s ease-in-out infinite; }
    .idle .pulse-dot { background: #94a3b8; animation: none; }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.4; transform:scale(0.75); } }
    #stage { position: fixed; top: 64px; bottom: 0; left: 0; right: 0; display: flex; }
    #waiting { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 3rem; gap: 1.5rem; transition: opacity 0.5s; }
    #waiting h2 { font-size: 2.75rem; font-weight: 800; color: rgba(255,255,255,0.9); line-height: 1.2; }
    #waiting p { font-size: 1.2rem; color: rgba(255,255,255,0.5); max-width: 560px; }
    .waiting-qr { background: #fff; padding: 1.25rem; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    .waiting-qr img { width: 200px; height: 200px; display: block; }
    .scan-label { font-size: 1rem; color: var(--emerald); font-weight: 600; }
    #split-screen { display: none; width: 100%; height: 100%; position: relative; }
    #split-screen.visible { display: flex; }
    #arabic-panel { flex: 0 0 58%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 4rem; border-right: 1px solid var(--divider); position: relative; background: linear-gradient(135deg, rgba(16,185,129,0.03) 0%, transparent 60%); }
    #translation-panel { flex: 0 0 42%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 3.5rem; position: relative; }
    .panel-label { position: absolute; top: 1.5rem; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); border: 1px solid var(--divider); padding: 0.2rem 0.7rem; border-radius: 999px; }
    #arabic-text { font-family: 'Amiri', serif; font-size: clamp(2rem, 4.5vw, 4rem); line-height: 1.7; text-align: center; direction: rtl; color: #f1f5f9; text-shadow: 0 2px 20px rgba(16,185,129,0.15); }
    #translated-text { font-size: clamp(1.5rem, 3vw, 2.8rem); font-weight: 500; line-height: 1.55; text-align: center; color: #e2e8f0; }
    .fade-in { animation: fadeUp 0.5s ease forwards; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    #ayah-banner { display: none; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; padding: 4rem; background: radial-gradient(ellipse at center, rgba(245,158,11,0.08) 0%, transparent 70%); }
    #ayah-banner.visible { display: flex; }
    .ayah-badge { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--gold); color: #000; font-size: 0.95rem; font-weight: 700; padding: 0.4rem 1.1rem; border-radius: 999px; letter-spacing: 0.04em; margin-bottom: 2rem; }
    #ayah-reference { font-size: 1.1rem; color: var(--gold-light); font-weight: 600; margin-bottom: 2rem; }
    #ayah-arabic { font-family: 'Amiri', serif; font-size: clamp(2.5rem, 5vw, 4.5rem); line-height: 1.65; direction: rtl; text-align: center; color: #fef3c7; text-shadow: 0 0 40px rgba(245,158,11,0.3); margin-bottom: 2.5rem; }
    #ayah-translation { font-size: clamp(1.4rem, 2.5vw, 2.2rem); font-weight: 400; font-style: italic; text-align: center; color: rgba(255,255,255,0.8); max-width: 900px; line-height: 1.6; }
    #qr-corner { position: fixed; bottom: 1.75rem; right: 1.75rem; z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
    .qr-label { font-size: 0.72rem; font-weight: 600; color: rgba(255,255,255,0.5); letter-spacing: 0.06em; text-transform: uppercase; }
    .qr-box { background: #fff; border-radius: 14px; padding: 0.75rem; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
    #qr-corner img { width: 100px; height: 100px; display: block; }
    .join-url { font-size: 0.65rem; color: rgba(255,255,255,0.4); text-align: center; max-width: 110px; word-break: break-all; }
    #btn-fullscreen { position: fixed; top: 70px; right: 16px; z-index: 300; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.5); font-size: 0.78rem; padding: 0.3rem 0.65rem; border-radius: 6px; cursor: pointer; transition: background 0.2s; font-family: inherit; }
    #btn-fullscreen:hover { background: rgba(255,255,255,0.12); color: #fff; }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="left">
      <span style="font-size:1.6rem">🕌</span>
      <span id="mosque-name">Masjid Al-Noor</span>
      <div class="live-badge idle" id="live-badge">
        <div class="pulse-dot"></div>
        <span id="live-text">WAITING</span>
      </div>
    </div>
    <span id="clock">--:--:--</span>
  </div>

  <button id="btn-fullscreen" onclick="toggleFullscreen()">⛶ Fullscreen</button>

  <div id="stage">
    <div id="waiting">
      <div style="font-size:4rem">📖</div>
      <h2>Friday Khutbah Starting Soon</h2>
      <p>Scan the QR code to follow along and hear live translation in your own language</p>
      <div class="waiting-qr"><img id="waiting-qr-img" src="" alt="Join QR" /></div>
      <div class="scan-label">📱 Scan to join on your phone — no app needed</div>
    </div>

    <div id="split-screen">
      <div id="arabic-panel">
        <span class="panel-label">Arabic — عربي</span>
        <div id="arabic-text" dir="rtl"></div>
      </div>
      <div id="translation-panel">
        <span id="lang-indicator" class="panel-label">English</span>
        <div id="translated-text"></div>
      </div>
      <div id="ayah-banner">
        <div class="ayah-badge">📖 Holy Quran</div>
        <div id="ayah-reference"></div>
        <div id="ayah-arabic" dir="rtl"></div>
        <div id="ayah-translation"></div>
      </div>
    </div>
  </div>

  <div id="qr-corner">
    <div class="qr-label">Scan to listen</div>
    <div class="qr-box"><img id="qr-img" src="" alt="Join QR" /></div>
    <div class="join-url" id="join-url-text"></div>
  </div>

  <script src="display.js"></script>
</body>
</html>
